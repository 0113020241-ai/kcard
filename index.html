<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>노트</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="노트">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<script>
  // 잠금이 켜져 있으면 화면이 그려지기 전에 가린다 (내용이 잠깐 비치는 걸 막음)
  try { if (localStorage.getItem("corpcard.lock")) document.documentElement.classList.add("locked"); } catch {}
</script>
<style>
  :root {
    --bg: #f2f2f7;
    --card: #ffffff;
    --text: #000000;
    --sub: #6e6e73;
    --line: #e5e5ea;
    --blue: #007aff;
    --green: #34c759;
    --orange: #ff9500;
    --red: #ff3b30;
    --track: #e5e5ea;
    --field: #f2f2f7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --card: #1c1c1e;
      --text: #ffffff;
      --sub: #98989f;
      --line: #38383a;
      --blue: #0a84ff;
      --green: #30d158;
      --orange: #ff9f0a;
      --red: #ff453a;
      --track: #3a3a3c;
      --field: #2c2c2e;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 24px);
    max-width: 480px;
    margin: 0 auto;
    font-variant-numeric: tabular-nums;
  }

  /* 카드 선택 줄 */
  .top { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .picker {
    flex: 1; min-width: 0; position: relative;
    background: var(--card); border-radius: 12px;
    display: flex; align-items: center; padding: 0 12px;
  }
  .picker select {
    appearance: none; -webkit-appearance: none;
    flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--text);
    font: inherit; font-size: 17px; font-weight: 600; padding: 11px 20px 11px 0;
    text-overflow: ellipsis;
  }
  .picker::after {
    content: ""; position: absolute; right: 14px; pointer-events: none;
    width: 7px; height: 7px; border-right: 2px solid var(--sub); border-bottom: 2px solid var(--sub);
    transform: translateY(-2px) rotate(45deg);
  }
  .gear {
    border: 0; background: var(--card); color: var(--sub);
    width: 44px; height: 44px; border-radius: 12px; font-size: 20px;
  }
  .month { text-align: center; font-size: 15px; font-weight: 600; color: var(--sub); margin-bottom: 12px; }

  .card { background: var(--card); border-radius: 20px; padding: 22px 20px; }
  .label { font-size: 15px; color: var(--sub); }
  .bigrow { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 8px; margin-top: 2px; }
  .big { font-size: 44px; font-weight: 700; letter-spacing: -1px; line-height: 1.15; }
  .daysleft { font-size: 14px; color: var(--sub); white-space: nowrap; }
  .used { font-size: 26px; font-weight: 700; }
  .row { display: flex; justify-content: space-between; align-items: baseline; margin-top: 18px; }
  .bar { height: 10px; background: var(--track); border-radius: 5px; overflow: hidden; margin-top: 16px; }
  .fill { height: 100%; width: 0; border-radius: 5px; background: var(--green); transition: width .3s, background .3s; }
  .hint { font-size: 13px; color: var(--sub); margin-top: 10px; }

  form.add { margin-top: 16px; display: flex; gap: 10px; }
  .amount {
    flex: 1; min-width: 0; display: flex; align-items: center;
    background: var(--card); border-radius: 14px; padding: 0 16px;
  }
  .amount input {
    flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--text);
    font: inherit; font-size: 24px; font-weight: 600; padding: 14px 0; text-align: right;
  }
  .amount span { font-size: 20px; color: var(--sub); margin-left: 6px; }
  button.go {
    border: 0; border-radius: 14px; background: var(--blue); color: #fff;
    font: inherit; font-size: 18px; font-weight: 600; padding: 0 22px;
  }
  button.go:disabled { opacity: .4; }

  h2 { font-size: 13px; font-weight: 400; color: var(--sub); margin: 28px 4px 8px; }
  ul { list-style: none; margin: 0; padding: 0; background: var(--card); border-radius: 14px; overflow: hidden; }
  li { display: flex; align-items: center; padding: 12px 8px 12px 16px; border-top: 1px solid var(--line); }
  li:first-child { border-top: 0; }
  li .when { color: var(--sub); font-size: 15px; flex: 1; }
  li .won { font-size: 17px; font-weight: 600; }
  li .x {
    border: 0; background: transparent; color: var(--sub); font-size: 20px;
    width: 40px; height: 32px; margin-left: 4px;
  }
  .empty { padding: 18px 16px; color: var(--sub); font-size: 15px; text-align: center; }

  .toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 20px);
    transform: translate(-50%, 20px); opacity: 0; pointer-events: none; z-index: 30;
    background: rgba(40,40,40,.95); color: #fff; border-radius: 12px;
    padding: 10px 8px 10px 16px; display: flex; align-items: center; gap: 8px;
    font-size: 15px; white-space: nowrap; transition: opacity .2s, transform .2s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .toast button { border: 0; background: transparent; color: #64d2ff; font: inherit; font-weight: 600; padding: 4px 8px; }

  /* 카드 관리 화면 */
  .sheet {
    position: fixed; inset: 0; z-index: 20; background: var(--bg);
    padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 24px);
    overflow-y: auto; display: none;
  }
  .sheet.show { display: block; }
  .sheet > .inner { max-width: 480px; margin: 0 auto; }
  .sheetbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .sheetbar h1 { font-size: 18px; font-weight: 600; margin: 0; }
  .sheetbar button { border: 0; background: transparent; color: var(--blue); font: inherit; font-size: 17px; padding: 6px 0; }
  .cardrow { display: flex; align-items: center; padding: 14px 16px; border-top: 1px solid var(--line); }
  .cardrow:first-child { border-top: 0; }
  .cardrow .info { flex: 1; min-width: 0; text-align: left; }
  .cardrow .nm { font-size: 17px; }
  .cardrow .lm { font-size: 13px; color: var(--sub); margin-top: 2px; }
  .cardrow .chev { color: var(--sub); font-size: 17px; margin-left: 8px; }
  button.rowbtn { width: 100%; border: 0; background: transparent; color: var(--text); font: inherit; display: flex; align-items: center; }
  button.plus {
    width: 100%; margin-top: 14px; border: 0; border-radius: 14px;
    background: var(--card); color: var(--blue); font: inherit; font-size: 17px; padding: 15px;
  }
  .field { background: var(--card); border-radius: 14px; padding: 0 16px; display: flex; align-items: center; margin-top: 10px; }
  .field label { font-size: 16px; color: var(--sub); width: 68px; flex: none; }
  .field input {
    flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--text);
    font: inherit; font-size: 17px; padding: 15px 0; text-align: right;
  }
  .field .unit { font-size: 16px; color: var(--sub); margin-left: 6px; }
  button.save {
    width: 100%; margin-top: 20px; border: 0; border-radius: 14px;
    background: var(--blue); color: #fff; font: inherit; font-size: 17px; font-weight: 600; padding: 15px;
  }
  button.save:disabled { opacity: .4; }
  button.del {
    width: 100%; margin-top: 10px; border: 0; border-radius: 14px;
    background: var(--card); color: var(--red); font: inherit; font-size: 17px; padding: 15px;
  }
  .note { font-size: 13px; color: var(--sub); margin: 10px 4px 0; line-height: 1.5; }

  /* 설정 안 작은 구역 */
  .sect { font-size: 13px; color: var(--sub); margin: 26px 4px 8px; }
  .toggle { display: flex; align-items: center; background: var(--card); border-radius: 14px; padding: 14px 16px; }
  .toggle .tl { flex: 1; min-width: 0; font-size: 17px; }
  .toggle input { width: 51px; height: 31px; margin: 0; flex: none; }
  .danger { color: var(--red); }

  /* 잠금 화면 */
  html.locked .app { display: none; }
  #lockScreen { display: none; }
  html.locked #lockScreen {
    display: flex; position: fixed; inset: 0; z-index: 50; background: var(--bg);
    flex-direction: column; align-items: center; justify-content: center;
    padding: 24px calc(env(safe-area-inset-left) + 24px);
  }
  #lockScreen .mark { font-size: 54px; line-height: 1; margin-bottom: 18px; }
  #lockScreen h1 { font-size: 20px; font-weight: 600; margin: 0 0 8px; }
  #lockScreen p { font-size: 14px; color: var(--sub); margin: 0 0 26px; text-align: center; line-height: 1.5; }
  #lockScreen .unlock {
    border: 0; border-radius: 14px; background: var(--blue); color: #fff;
    font: inherit; font-size: 17px; font-weight: 600; padding: 15px 36px;
  }
  #lockScreen .alt { border: 0; background: transparent; color: var(--blue); font: inherit; font-size: 15px; padding: 14px; margin-top: 6px; }
  #pinPad { width: 100%; max-width: 260px; display: none; }
  #pinPad input {
    width: 100%; border: 0; outline: 0; border-radius: 14px; background: var(--card); color: var(--text);
    font: inherit; font-size: 28px; font-weight: 600; letter-spacing: 10px; text-align: center; padding: 16px;
  }
</style>
</head>
<body>
  <div id="lockScreen">
    <div class="mark">▤</div>
    <h1>노트</h1>
    <p id="lockMsg">잠금을 풀어 주세요</p>
    <button class="unlock" id="unlockBtn" type="button">잠금 해제</button>
    <form id="pinPad" autocomplete="off">
      <input id="pinInput" inputmode="numeric" maxlength="6" placeholder="••••" aria-label="비밀번호">
    </form>
    <button class="alt" id="altBtn" type="button">비밀번호로 열기</button>
  </div>

  <div class="app">
  <div class="top">
    <div class="picker">
      <select id="cardSel" aria-label="카드 선택"></select>
    </div>
    <button class="gear" id="manageBtn" type="button" aria-label="카드 관리">⚙</button>
  </div>
  <div class="month" id="month"></div>

  <div class="card">
    <div class="label" id="remainLabel">남은 금액</div>
    <div class="bigrow">
      <span class="big" id="remain">0원</span>
      <span class="daysleft" id="daysLeft"></span>
    </div>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="row">
      <div>
        <div class="label">사용 합계</div>
        <div class="used" id="used">0원</div>
      </div>
      <div class="label" id="limit"></div>
    </div>
    <div class="hint" id="hint"></div>
  </div>

  <form class="add" id="addForm" autocomplete="off">
    <label class="amount">
      <input id="input" inputmode="numeric" placeholder="사용 금액" aria-label="사용 금액">
      <span>원</span>
    </label>
    <button class="go" id="addBtn" disabled>추가</button>
  </form>

  <h2 id="listTitle">이번 달 내역</h2>
  <ul id="list"></ul>
  </div><!-- /.app -->

  <div class="toast" id="toast" role="status">
    <span id="toastText"></span>
    <button id="undoBtn" type="button">취소</button>
  </div>

  <!-- 카드 목록 -->
  <div class="sheet" id="listSheet">
    <div class="inner">
      <div class="sheetbar">
        <h1>설정</h1>
        <button type="button" id="listClose">완료</button>
      </div>

      <div class="sect">카드</div>
      <ul id="cardList"></ul>
      <button class="plus" type="button" id="newCardBtn">+ 카드 추가</button>
      <p class="note" id="listNote"></p>

      <div class="sect">잠금</div>
      <div class="toggle">
        <span class="tl" id="lockLabel">잠그기</span>
        <input type="checkbox" id="lockToggle" aria-label="잠금 사용">
      </div>
      <p class="note" id="lockNote"></p>

      <div class="sect">기록 보관</div>
      <div class="toggle">
        <span class="tl" id="purgeLabel">자동 삭제</span>
        <input type="checkbox" id="purgeToggle" aria-label="오래된 기록 자동 삭제">
      </div>
      <p class="note">
        기록은 <b>이 휴대폰 안에만</b> 저장돼요. 서버로 보내지 않고, 다른 사람은 볼 수 없어요.
        그래서 백업도 없어요 — 앱을 지우면 기록도 함께 사라져요.
      </p>

      <button class="del" type="button" id="wipeBtn">기록 전부 삭제</button>
      <p class="note" style="text-align:center" id="verNote"></p>
    </div>
  </div>

  <!-- 카드 편집 -->
  <div class="sheet" id="editSheet">
    <div class="inner">
      <div class="sheetbar">
        <h1 id="editTitle">카드 추가</h1>
        <button type="button" id="editClose">취소</button>
      </div>
      <form id="editForm" autocomplete="off">
        <div class="field">
          <label for="nameInput">별명</label>
          <input id="nameInput" placeholder="예: 법인카드" maxlength="20">
        </div>
        <div class="field">
          <label for="limitInput">한도</label>
          <input id="limitInput" inputmode="numeric" placeholder="1,000,000">
          <span class="unit">원</span>
        </div>
        <div class="field">
          <label for="startInput">시작일</label>
          <input id="startInput" inputmode="numeric" placeholder="1" maxlength="2">
          <span class="unit">일</span>
        </div>
        <p class="note" id="periodNote"></p>
        <button class="save" id="saveBtn" type="submit">저장</button>
      </form>
      <button class="del" type="button" id="delBtn">이 카드 삭제</button>
      <p class="note" id="editNote"></p>
    </div>
  </div>

<script>
  const MAX_CARDS = 5;                    // 카드는 최대 5장
  const APP_VERSION = "v7";               // 설정 맨 아래에 표시 — 업데이트 됐는지 확인용
  const MAX_START_DAY = 28;               // 달마다 날짜 수가 달라서 28일까지만
  const KEEP_MONTHS = 2;                  // 자동 삭제까지 보관할 개월 수
  const RELOCK_MS = 60 * 1000;            // 앱을 벗어난 뒤 다시 잠기기까지
  const CARDS_KEY = "corpcard.cards";     // [{id, name, limit}]
  const ENTRIES_KEY = "corpcard.entries"; // [{t: 사용시각(ms), a: 금액, c: 카드id}]
  const SEL_KEY = "corpcard.selected";
  const LOCK_KEY = "corpcard.lock";       // {kind:"faceid", id} 또는 {kind:"pin", salt, hash}
  const PURGE_KEY = "corpcard.purge";     // "off"면 자동 삭제 안 함

  const $ = (id) => document.getElementById(id);
  const won = (n) => n.toLocaleString("ko-KR") + "원";
  const digits = (s) => s.replace(/\D/g, "");

  function read(key, fallback) {
    try { const v = JSON.parse(localStorage.getItem(key)); return v ?? fallback; }
    catch { return fallback; }
  }
  function write(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
  }

  let cards = read(CARDS_KEY, null);
  let entries = read(ENTRIES_KEY, []);
  let selected = (() => { try { return localStorage.getItem(SEL_KEY); } catch { return null; } })();

  // 예전(카드 1장) 기록을 카드별 구조로 옮긴다
  if (!Array.isArray(cards) || !cards.length) {
    cards = [{ id: "c1", name: "법인카드", limit: 1000000 }];
    write(CARDS_KEY, cards);
  }
  if (entries.some((e) => !e.c)) {
    entries = entries.map((e) => (e.c ? e : { ...e, c: cards[0].id }));
    write(ENTRIES_KEY, entries);
  }
  if (!cards.some((c) => c.id === selected)) {
    selected = cards[0].id;
    try { localStorage.setItem(SEL_KEY, selected); } catch {}
  }

  // 예전 카드에는 집계 시작일이 없으니 1일로 채운다
  if (cards.some((c) => !c.startDay)) {
    cards = cards.map((c) => (c.startDay ? c : { ...c, startDay: 1 }));
    write(CARDS_KEY, cards);
  }

  // 오래된 기록 자동 삭제
  function purgeOld() {
    if (localStorage.getItem(PURGE_KEY) === "off") return;
    const cutoff = new Date();
    cutoff.setMonth(cutoff.getMonth() - KEEP_MONTHS);
    const kept = entries.filter((e) => e.t >= cutoff.getTime());
    if (kept.length !== entries.length) {
      entries = kept;
      write(ENTRIES_KEY, entries);
    }
  }
  purgeOld();

  const currentCard = () => cards.find((c) => c.id === selected) || cards[0];

  let lastAdded = null;
  let toastTimer = null;
  let editingId = null; // null이면 새 카드

  // 카드의 집계 기간. 시작일이 1이면 1일~말일, 23이면 23일~다음 달 22일.
  function periodOf(card, now = new Date()) {
    const startDay = Math.min(Math.max(card.startDay || 1, 1), MAX_START_DAY);
    let y = now.getFullYear();
    let m = now.getMonth();
    if (now.getDate() < startDay) m -= 1;          // 아직 이번 회차가 시작되기 전이면 지난 회차
    const start = new Date(y, m, startDay);
    const end = new Date(y, m + 1, startDay);       // 다음 회차 시작 = 이번 회차 끝(미포함)
    return { start, end, startDay };
  }

  function periodEntries(card, now = new Date()) {
    const { start, end } = periodOf(card, now);
    return entries
      .filter((e) => e.c === card.id && e.t >= start.getTime() && e.t < end.getTime())
      .sort((a, b) => b.t - a.t);
  }

  const md = (d) => `${d.getMonth() + 1}/${d.getDate()}`;

  function periodLabel(card, now = new Date()) {
    const { start, end, startDay } = periodOf(card, now);
    if (startDay === 1) return `${start.getFullYear()}년 ${start.getMonth() + 1}월`;
    const last = new Date(end.getTime() - 86400000);  // 마지막 날
    return `${md(start)} ~ ${md(last)}`;
  }

  function renderPicker() {
    const sel = $("cardSel");
    sel.replaceChildren();
    for (const c of cards) {
      const opt = document.createElement("option");
      opt.value = c.id;
      opt.textContent = c.name;
      sel.append(opt);
    }
    sel.value = selected;
  }

  function render() {
    const now = new Date();
    const card = currentCard();
    const items = periodEntries(card, now);
    const used = items.reduce((s, e) => s + e.a, 0);
    const remain = card.limit - used;
    const ratio = card.limit > 0 ? used / card.limit : 0;

    $("month").textContent = periodLabel(card, now);
    $("used").textContent = won(used);
    $("limit").textContent = "한도 " + won(card.limit);
    $("remainLabel").textContent = remain >= 0 ? "남은 금액" : "한도 초과";
    $("remain").textContent = won(Math.abs(remain));

    const color = ratio < 0.7 ? "var(--green)" : ratio < 0.9 ? "var(--orange)" : "var(--red)";
    $("remain").style.color = remain >= 0 ? color : "var(--red)";
    $("fill").style.width = Math.min(ratio, 1) * 100 + "%";
    $("fill").style.background = color;

    const { end, startDay } = periodOf(card, now);
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const daysLeft = Math.max(Math.round((end - today) / 86400000), 1);
    const lastDate = new Date(end.getTime() - 86400000);
    $("daysLeft").textContent = daysLeft === 1 ? "오늘이 마지막 날" : `${daysLeft}일 남음`;
    $("hint").textContent = remain > 0
      ? `${startDay === 1 ? "말일" : md(lastDate)}까지 · 하루 평균 ${won(Math.floor(remain / daysLeft))}`
      : remain === 0 ? "한도를 모두 사용했어요" : "";

    const title = startDay === 1 ? "이번 달 내역" : "이번 기간 내역";
    $("listTitle").textContent = items.length ? `${title} ${items.length}건` : title;
    const list = $("list");
    list.replaceChildren();
    if (!items.length) {
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = "아직 사용 내역이 없어요";
      list.append(li);
    }
    for (const e of items) {
      const d = new Date(e.t);
      const li = document.createElement("li");
      const when = document.createElement("span");
      when.className = "when";
      when.textContent = `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
      const amt = document.createElement("span");
      amt.className = "won";
      amt.textContent = won(e.a);
      const del = document.createElement("button");
      del.type = "button";
      del.className = "x";
      del.textContent = "×";
      del.setAttribute("aria-label", `${won(e.a)} 삭제`);
      del.onclick = () => {
        if (!confirm(`${when.textContent} ${won(e.a)} 내역을 삭제할까요?`)) return;
        entries = entries.filter((x) => x !== e);
        write(ENTRIES_KEY, entries);
        render();
      };
      li.append(when, amt, del);
      list.append(li);
    }
  }

  function showToast(text) {
    $("toastText").textContent = text;
    $("toast").classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $("toast").classList.remove("show"), 4000);
  }

  // 금액 입력란에 자동으로 쉼표 넣기
  function commaInput(el, onChange) {
    el.addEventListener("input", () => {
      const d = digits(el.value).replace(/^0+/, "").slice(0, 9);
      el.value = d ? Number(d).toLocaleString("ko-KR") : "";
      if (onChange) onChange(d);
    });
  }

  commaInput($("input"), (d) => { $("addBtn").disabled = !d; });

  $("addForm").addEventListener("submit", (ev) => {
    ev.preventDefault();
    const amount = Number(digits($("input").value));
    if (!amount) return;
    lastAdded = { t: Date.now(), a: amount, c: currentCard().id };
    entries.push(lastAdded);
    write(ENTRIES_KEY, entries);
    $("input").value = "";
    $("addBtn").disabled = true;
    $("input").blur();
    render();
    showToast(`${won(amount)} 추가됨`);
  });

  $("undoBtn").addEventListener("click", () => {
    if (lastAdded) {
      entries = entries.filter((x) => x !== lastAdded);
      lastAdded = null;
      write(ENTRIES_KEY, entries);
      render();
    }
    $("toast").classList.remove("show");
  });

  $("cardSel").addEventListener("change", (ev) => {
    selected = ev.target.value;
    try { localStorage.setItem(SEL_KEY, selected); } catch {}
    lastAdded = null;
    $("toast").classList.remove("show");
    render();
  });

  // ----- 카드 관리 -----

  function openSheet(id) { $(id).classList.add("show"); }
  function closeSheet(id) { $(id).classList.remove("show"); }

  function renderCardList() {
    const list = $("cardList");
    list.replaceChildren();
    for (const c of cards) {
      const used = periodEntries(c).reduce((s, e) => s + e.a, 0);
      const li = document.createElement("li");
      li.className = "cardrow";
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "rowbtn";
      const info = document.createElement("span");
      info.className = "info";
      const nm = document.createElement("div");
      nm.className = "nm";
      nm.textContent = c.name;
      const lm = document.createElement("div");
      lm.className = "lm";
      lm.textContent = `한도 ${won(c.limit)} · ${periodLabel(c)} ${won(used)}`;
      info.append(nm, lm);
      const chev = document.createElement("span");
      chev.className = "chev";
      chev.textContent = "›";
      btn.append(info, chev);
      btn.onclick = () => openEdit(c.id);
      li.append(btn);
      list.append(li);
    }
    const full = cards.length >= MAX_CARDS;
    $("newCardBtn").style.display = full ? "none" : "block";
    $("listNote").textContent = full
      ? `카드는 최대 ${MAX_CARDS}장까지 등록할 수 있어요. 더 넣으려면 안 쓰는 카드를 삭제해 주세요.`
      : `카드마다 한도와 사용 내역이 따로 관리돼요. (${cards.length}/${MAX_CARDS}장)`;
  }

  function openEdit(id) {
    if (!id && cards.length >= MAX_CARDS) {
      alert(`카드는 최대 ${MAX_CARDS}장까지 등록할 수 있어요.`);
      return;
    }
    editingId = id;
    const card = id ? cards.find((c) => c.id === id) : null;
    $("editTitle").textContent = card ? "카드 수정" : "카드 추가";
    $("nameInput").value = card ? card.name : "";
    $("limitInput").value = card ? card.limit.toLocaleString("ko-KR") : "";
    $("startInput").value = card ? String(card.startDay || 1) : "1";
    showPeriodNote();
    $("delBtn").style.display = card && cards.length > 1 ? "block" : "none";
    $("editNote").textContent = card
      ? "한도나 시작일을 바꿔도 이미 기록한 내역은 지워지지 않아요."
      : "별명은 나중에 바꿀 수 있어요.";
    openSheet("editSheet");
    if (!card) $("nameInput").focus();
  }

  // 시작일을 바꾸면 어떤 기간이 되는지 바로 보여준다
  function showPeriodNote() {
    const day = Number(digits($("startInput").value)) || 1;
    if (day === 1) {
      $("periodNote").textContent = "매월 1일부터 말일까지 합산해요.";
      return;
    }
    const { start, end } = periodOf({ startDay: day });
    const last = new Date(end.getTime() - 86400000);
    $("periodNote").textContent =
      `매월 ${day}일부터 다음 달 ${last.getDate()}일까지 합산해요. (이번 회차: ${md(start)} ~ ${md(last)})`;
  }

  commaInput($("limitInput"));

  $("startInput").addEventListener("input", (ev) => {
    let d = digits(ev.target.value).slice(0, 2);
    if (d && Number(d) > MAX_START_DAY) d = String(MAX_START_DAY);
    ev.target.value = d;
    showPeriodNote();
  });

  $("editForm").addEventListener("submit", (ev) => {
    ev.preventDefault();
    const name = $("nameInput").value.trim();
    const limit = Number(digits($("limitInput").value));
    const startDay = Math.min(Math.max(Number(digits($("startInput").value)) || 1, 1), MAX_START_DAY);
    if (!name) { alert("카드 별명을 입력해 주세요."); return; }
    if (!limit) { alert("한도를 입력해 주세요."); return; }

    if (editingId) {
      const card = cards.find((c) => c.id === editingId);
      card.name = name;
      card.limit = limit;
      card.startDay = startDay;
    } else {
      const id = "c" + Date.now();
      cards.push({ id, name, limit, startDay });
      selected = id;
      try { localStorage.setItem(SEL_KEY, selected); } catch {}
    }
    write(CARDS_KEY, cards);
    closeSheet("editSheet");
    renderPicker();
    renderCardList();
    render();
  });

  $("delBtn").addEventListener("click", () => {
    const card = cards.find((c) => c.id === editingId);
    if (!card) return;
    const count = entries.filter((e) => e.c === card.id).length;
    const msg = count
      ? `"${card.name}" 카드와 사용 내역 ${count}건을 모두 삭제할까요?\n되돌릴 수 없어요.`
      : `"${card.name}" 카드를 삭제할까요?`;
    if (!confirm(msg)) return;
    cards = cards.filter((c) => c.id !== card.id);
    entries = entries.filter((e) => e.c !== card.id);
    write(CARDS_KEY, cards);
    write(ENTRIES_KEY, entries);
    if (selected === card.id) {
      selected = cards[0].id;
      try { localStorage.setItem(SEL_KEY, selected); } catch {}
    }
    closeSheet("editSheet");
    renderPicker();
    renderCardList();
    render();
  });

  $("manageBtn").addEventListener("click", () => { renderCardList(); renderLockSetting(); openSheet("listSheet"); });
  $("listClose").addEventListener("click", () => closeSheet("listSheet"));
  $("newCardBtn").addEventListener("click", () => openEdit(null));
  $("editClose").addEventListener("click", () => closeSheet("editSheet"));

  // ----- 잠금 -----
  // 화면을 가리는 자물쇠일 뿐, 기록 자체를 암호로 바꾸지는 않는다.
  // 휴대폰 자체 잠금 위에 한 겹 더 두는 용도.

  const lockInfo = () => read(LOCK_KEY, null);
  const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const rand = (n) => crypto.getRandomValues(new Uint8Array(n));

  async function sha256(text) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return b64(buf);
  }

  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
    || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const BIO = isIOS ? "Face ID" : "지문";
  const BIO_OR = isIOS ? "Face ID나" : "지문이나";   // 한글 조사

  const canFaceId = () =>
    !!(window.PublicKeyCredential && navigator.credentials && location.protocol === "https:");

  async function registerFaceId() {
    const cred = await navigator.credentials.create({
      publicKey: {
        challenge: rand(32),
        rp: { name: "노트" },
        user: { id: rand(16), name: "me", displayName: "나" },
        pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }],
        authenticatorSelection: {
          authenticatorAttachment: "platform",
          userVerification: "required",
          residentKey: "preferred",
        },
        timeout: 60000,
      },
    });
    if (!cred) throw new Error("no credential");
    return b64(cred.rawId);
  }

  async function verifyFaceId(id) {
    const cred = await navigator.credentials.get({
      publicKey: {
        challenge: rand(32),
        allowCredentials: [{ type: "public-key", id: unb64(id) }],
        userVerification: "required",
        timeout: 60000,
      },
    });
    return !!cred;
  }

  let unlocked = !lockInfo();
  let hiddenAt = 0;

  function lockNow() {
    const info = lockInfo();
    if (!info) return;
    unlocked = false;
    document.documentElement.classList.add("locked");
    $("pinPad").style.display = "none";
    $("unlockBtn").style.display = "block";
    $("altBtn").style.display = info.kind === "faceid" ? "block" : "none";
    $("lockMsg").textContent = info.kind === "faceid"
      ? `${BIO}로 잠금을 풀어 주세요`
      : "비밀번호를 입력해 주세요";
    if (info.kind === "pin") showPinPad();
  }

  function unlockDone() {
    unlocked = true;
    hiddenAt = 0;
    document.documentElement.classList.remove("locked");
    $("pinInput").value = "";
    render();
  }

  function showPinPad() {
    $("pinPad").style.display = "block";
    $("unlockBtn").style.display = "none";
    $("altBtn").style.display = "none";
    $("lockMsg").textContent = "비밀번호를 입력해 주세요";
    setTimeout(() => $("pinInput").focus(), 50);
  }

  async function tryUnlock() {
    const info = lockInfo();
    if (!info) return unlockDone();
    if (info.kind === "faceid") {
      try {
        if (await verifyFaceId(info.id)) unlockDone();
      } catch {
        $("lockMsg").textContent = "잠금을 풀지 못했어요. 다시 시도해 주세요.";
      }
    } else {
      showPinPad();
    }
  }

  $("unlockBtn").addEventListener("click", tryUnlock);
  $("altBtn").addEventListener("click", showPinPad);

  $("pinPad").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const info = lockInfo();
    if (!info || info.kind !== "pin") return;
    const pin = digits($("pinInput").value);
    if (!pin) return;
    if (await sha256(info.salt + pin) === info.hash) {
      unlockDone();
    } else {
      $("pinInput").value = "";
      $("lockMsg").textContent = "비밀번호가 맞지 않아요.";
    }
  });

  async function enableLock() {
    if (canFaceId()) {
      try {
        const id = await registerFaceId();
        write(LOCK_KEY, { kind: "faceid", id });
        return true;
      } catch {
        // 생체인증을 못 쓰면 비밀번호로 넘어간다
      }
    }
    const pin = prompt("앱을 열 때 쓸 숫자 비밀번호를 정해 주세요 (4~6자리)");
    if (pin === null) return false;
    const only = digits(pin);
    if (only.length < 4) { alert("숫자 4자리 이상으로 정해 주세요."); return false; }
    const again = prompt("한 번 더 입력해 주세요");
    if (digits(again || "") !== only) { alert("두 번 입력한 값이 달라요."); return false; }
    const salt = b64(rand(16));
    write(LOCK_KEY, { kind: "pin", salt, hash: await sha256(salt + only) });
    return true;
  }

  function renderLockSetting() {
    const info = lockInfo();
    $("lockToggle").checked = !!info;
    $("lockLabel").textContent = info && info.kind === "pin"
      ? "비밀번호로 잠그기"
      : canFaceId() ? `${BIO}로 잠그기` : "비밀번호로 잠그기";
    $("lockNote").textContent = info
      ? "앱을 열 때마다 잠금을 풀어야 해요. 화면을 가려 주는 기능이라, 휴대폰 잠금 위에 한 겹 더 두는 정도예요."
      : `켜면 앱을 열 때 ${BIO_OR} 비밀번호를 물어봐요. 남이 폰을 집어 들어도 내역이 바로 보이지 않아요.`;
    $("purgeToggle").checked = localStorage.getItem(PURGE_KEY) !== "off";
    $("purgeLabel").textContent = `${KEEP_MONTHS}개월 지나면 자동 삭제`;
    $("verNote").textContent = `버전 ${APP_VERSION}`;
  }

  $("lockToggle").addEventListener("change", async (ev) => {
    if (ev.target.checked) {
      const ok = await enableLock();
      if (!ok) ev.target.checked = false;
    } else {
      if (confirm("잠금을 끌까요? 앱을 열 때 아무것도 묻지 않게 돼요.")) {
        try { localStorage.removeItem(LOCK_KEY); } catch {}
        unlocked = true;
      } else {
        ev.target.checked = true;
      }
    }
    renderLockSetting();
  });

  $("purgeToggle").addEventListener("change", (ev) => {
    try { localStorage.setItem(PURGE_KEY, ev.target.checked ? "on" : "off"); } catch {}
    if (ev.target.checked) { purgeOld(); render(); }
    renderLockSetting();
  });

  $("wipeBtn").addEventListener("click", () => {
    if (!confirm("기록을 전부 지울까요?\n카드 설정은 남고 사용 내역만 사라져요. 되돌릴 수 없어요.")) return;
    entries = [];
    write(ENTRIES_KEY, entries);
    lastAdded = null;
    closeSheet("listSheet");
    render();
  });

  // 앱을 켜둔 채로 달이 바뀌거나, 다시 열었을 때 화면 갱신
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      hiddenAt = Date.now();
      return;
    }
    if (lockInfo() && unlocked && hiddenAt && Date.now() - hiddenAt > RELOCK_MS) {
      closeSheet("listSheet");
      closeSheet("editSheet");
      lockNow();
      return;
    }
    purgeOld();
    render();
  });

  renderPicker();
  renderLockSetting();
  render();
  if (lockInfo()) { lockNow(); tryUnlock(); }

  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

  // 새 버전이 올라오면 앱이 스스로 받아서 새로고침한다.
  // (예전엔 옛 버전에 갇히면 앱을 지웠다 깔아야 했음)
  if ("serviceWorker" in navigator) {
    let reloading = false;
    const hadController = !!navigator.serviceWorker.controller;  // 첫 설치면 새로고침 불필요
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (reloading || !hadController) return;
      reloading = true;
      location.reload();
    });
    navigator.serviceWorker.register("sw.js").then((reg) => {
      reg.update().catch(() => {});
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) reg.update().catch(() => {});
      });
    }).catch(() => {});
  }
</script>
</body>
</html>
